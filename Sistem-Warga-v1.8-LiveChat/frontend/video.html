<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10213a"><title>Video Call — Sistem WARGA</title><style>body{margin:0;background:#0b1220;color:#fff;font-family:system-ui,Arial}.bar{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;background:#111b2e}.bar b{font-size:17px}.status{font-size:12px;color:#b8c4d6}.videos{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;height:calc(100vh - 150px);box-sizing:border-box}.tile{position:relative;background:#02060d;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}.tile video{width:100%;height:100%;object-fit:cover}.label{position:absolute;left:10px;bottom:10px;background:#0009;padding:6px 9px;border-radius:8px;font-size:12px}.actions{padding:12px 14px;display:flex;gap:8px}.actions button{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}.end{background:#b3261e;color:#fff}.mute{background:#e9eef6;color:#182238}@media(max-width:700px){.videos{grid-template-columns:1fr;height:calc(100vh - 180px)}} </style></head><body><div class="bar"><b>🎥 Video Call Super Admin</b><span class="status" id="status">Menghubungkan…</span></div><div class="videos"><div class="tile"><video id="remote" autoplay playsinline></video><span class="label">Super Admin / Lawan Bicara</span></div><div class="tile"><video id="local" autoplay muted playsinline></video><span class="label">Kamera Anda</span></div></div><div class="actions"><button class="mute" id="mute">🎙️ Matikan Mikrofon</button><button class="mute" id="camera">📷 Matikan Kamera</button><button class="end" id="end">Tutup Panggilan</button></div><script>
const p=new URLSearchParams(location.search),sid=p.get('session'),role=p.get('role')||'warga';let pc,stream,seen=0,mic=true,cam=true,working=false;
const status=t=>document.getElementById('status').textContent=t;
async function api(path,opt){const r=await fetch(path,opt);if(!r.ok)throw Error();return r.json()}
async function send(type,payload){await api('/api/live-chat/session/'+sid+'/signals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender_role:role,signal_type:type,payload})})}
async function start(){if(!sid){status('Sesi tidak ditemukan');return}try{const s=await api('/api/live-chat/session/'+sid);if(s.session.status!=='aktif')await api('/api/live-chat/session/'+sid+'/claim',{method:'POST',headers:{'Content-Type':'application/json'}});stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('local').srcObject=stream;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>document.getElementById('remote').srcObject=e.streams[0];pc.onicecandidate=e=>e.candidate&&send('ice',e.candidate);if(role==='super_admin'){const offer=await pc.createOffer();await pc.setLocalDescription(offer);await send('offer',offer);status('Menunggu Warga terhubung…')}else status('Menunggu Super Admin…');poll();}catch(e){status('Kamera/mikrofon tidak dapat digunakan. Gunakan HTTPS dan izinkan perangkat.')}}
async function poll(){if(working)return;working=true;try{const rows=await api('/api/live-chat/session/'+sid+'/signals?role='+role);for(const x of rows){if(x.id<=seen)continue;seen=x.id;const pl=JSON.parse(x.payload);if(x.signal_type==='offer'&&role==='warga'){await pc.setRemoteDescription(pl);const a=await pc.createAnswer();await pc.setLocalDescription(a);await send('answer',a);status('Terhubung dengan Super Admin')}else if(x.signal_type==='answer'&&role==='super_admin'){await pc.setRemoteDescription(pl);status('Terhubung dengan Warga')}else if(x.signal_type==='ice'&&pl)try{await pc.addIceCandidate(pl)}catch(e){}}}catch(e){}working=false;setTimeout(poll,900)}
document.getElementById('mute').onclick=()=>{mic=!mic;stream?.getAudioTracks().forEach(t=>t.enabled=mic);document.getElementById('mute').textContent=mic?'🎙️ Matikan Mikrofon':'🔇 Nyalakan Mikrofon'};document.getElementById('camera').onclick=()=>{cam=!cam;stream?.getVideoTracks().forEach(t=>t.enabled=cam);document.getElementById('camera').textContent=cam?'📷 Matikan Kamera':'📷 Nyalakan Kamera'};document.getElementById('end').onclick=async()=>{try{await send('bye',{})}catch(e){}stream?.getTracks().forEach(t=>t.stop());pc?.close();location.href='/'};start();
</script></body></html>
