plugins { id 'com.android.application' }

android {
    namespace 'id.desamaju.warga'
    compileSdk 35

    defaultConfig {
        applicationId 'id.desamaju.warga'
        minSdk 23
        targetSdk 35
        versionCode 18
        versionName '1.8.0'
    }

    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { minifyEnabled false }
    }
}
